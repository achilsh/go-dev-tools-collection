Name: gateway-example # gateway name
Host: 0.0.0.0 # gateway host
Port: 8888 # gateway port
Upstreams: # upstreams
  # - Name: userservice
  #   Http: # grpc upstream
  #       Target: 0.0.0.0:8080 # grpc target,the direct grpc server address,for only one node
  #       Prefix: /api/v1  # 可选 后端服务的路由前缀，后端服务的url 为该前缀 + 网关对外提供的url
  #       Timeout: 3000    # 单位为毫秒，默认值 3000
  #   Mappings: # routes mapping： map request url to  /api/v1
  #     - Method: GET  ## 代理对外提供的方法,也是后端服务访问的方法
  #       Path: /ping   ## 代理对外提供的url, 后端路由在该url 前面加上 prefix的字段值
  #     - Method: GET
  #       Path: /users_only
  #     - Method: GET
  #       Path: /users/:id
  #     - Method: POST
  #       Path: /users/post
  # ## 路由重写时需要配置
- Name: studentservice 
  Http:
    Target: 0.0.0.0:0
  ### 用于服务监听的 url，指定在这些url接收数据
  Mappings:
  - Method: POST ## client 请求的 method, 大小写都可以
    # 客户都安请求的url Path: /play/v1/:lastId   ##  :lastId 是一个url中占位符，由实际传入值填充，比如: /pay/v1/isfad 是原请求的url
    Path: /play/v1/:lastId   ##  :lastId 是一个url中占位符，由实际传入值填充，比如: /pay/v1/isfad 是原请求的url
    # 指示是 http proxy
    HttpProxy: 1
    Rewrites: # 可以把 客户端发过来的每个url重写成特定的后端url
    - Method: POST
      Pattern: ^/play/v1/000004 ## 客户端  url 匹配的规则，包括精准匹配和正则表达式匹配；可进一步细分客户端的请求url
      Target:  /play/v1/login    ## 重写后的后端url, 就是 upstream url
      ## 访问target时 （每个 重写后的 url ） 对应的后端服务节点列表
      NodeList:
      - Node: 0.0.0.0:8081
        Weight: 5
        Timeout: 3000
      - Node: 0.0.0.0:8082
        Weight: 1
        Timeout: 3000
      Etcd:  ## 访问 target时，使用的etcd, 从中获取服务端的节点信息
        Hosts:  ## 这是etcd 的节点
        - 127.0.0.1:2379
        Key: student_info.http.1   ## 对端服务在etcd上注册key，根目录

    - Method: POST
      Pattern: ^/play/v1/aaaa3 ## 客户端  url 匹配的规则，包括精准匹配和正则表达式匹配；可进一步细分客户端的请求url
      Target:  /play/v1/send     ## 重写后的后端url, 就是 upstream url
      ## 访问 target 时 / （每个 重写后的 url） 对应的后端服务节点列表
      # NodeList:
      # - Node: 0.0.0.0:8081
      #   Weight: 100
      #   Timeout: 3000
      Etcd:  ## 访问 client target时，使用的etcd,从中获取服务端的节点信息
        Hosts:  ## 这是etcd 的节点
        - 127.0.0.1:2379
        Key: student_info.http.1   ## 对端服务在etcd上注册key，根目录

# ## 对所有的 upstreams 都适用；路由重写时 网关增加映射
# ReWrites:
#   - Method: POST
#     From: ^/play/v1/000004  ## 客户输入Url 
#     To: /play/v1/login     ## upstream 处理的url
#   - Method: POST
#     From: ^/play/v1/aaaa3
#     To: /play/v1/send