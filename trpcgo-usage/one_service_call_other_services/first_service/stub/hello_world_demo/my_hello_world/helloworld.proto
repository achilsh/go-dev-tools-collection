syntax = "proto3";

// 格式为： trpc.{app}.{server}； 通常和下面的服务名 连接起来 等效于 配置文件的 name 
package trpc.first.student;

option go_package = "hello_world_demo/my_hello_world";

// HelloRequest is hello request.
message HelloRequest {
  string msg = 1;
}

// HelloResponse is hello response.
message HelloResponse {
  string msg = 1;
}

// HelloWorldService handles hello request and echo message.
service StudentService {
  // Hello says hello.
  rpc Hello(HelloRequest) returns(HelloResponse); // @alias=/my_hello_world/hello
}