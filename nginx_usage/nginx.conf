# Nginx 代理本地和远程服务配置

# HTTP 块配置
http {
    # 定义上游服务器组
    upstream backend_local {
        server 127.0.0.1:8080;  # 本地服务
        server 127.0.0.1:8081;  # 本地服务备份
    }
    
    upstream backend_remote {
        server 192.168.1.100:8080;  # 远程服务器1
        server 192.168.1.101:8080;  # 远程服务器2
        server 192.168.1.102:8080 backup;  # 备份服务器
    }
    
    # 负载均衡配置
    upstream api_cluster {
        ip_hash;  # 基于客户端IP的会话保持
        server 127.0.0.1:3000 weight=3;  # 权重为3
        server 192.168.1.200:3000 weight=2;  # 权重为2
        server 192.168.1.201:3000 weight=1 max_fails=2 fail_timeout=30s;
    }

    # 主服务器配置
    server {
        listen 80;   # 定义 nginx 对外提供监听的端口
        server_name example.com www.example.com;  ##对外提供的域名， 定义服务器域名匹配规则。
        
        # 日志配置
        access_log /var/log/nginx/proxy_access.log;
        error_log /var/log/nginx/proxy_error.log;
        
        # local pattern 规则：
        # 1.  = /  意思是： 精确匹配  /  只匹配根路径 "/"，优先级最高
        # 2.  ^~ /images/   意思是： 优先前缀匹配 (^~) ； 匹配以 /images/ 开头的路径，不再检查正则表达式；# 匹配: /images/logo.png, /images/photos/1.jpg；# 不匹配: /img/logo.png
        # 3.  ~ \.(gif|jpg|png)$  意思是：正则匹配， 区分大小写 (~)； 匹配以 .gif/.jpg/.png 结尾的文件； 匹配: /photo.jpg, /logo.PNG (不匹配，区分大小写)
        # 4.  ~* \.(gif|jpg|png|jpeg)$  意思是：正则匹配 - 不区分大小写 (~*)； 匹配图片文件，不区分大小写； 匹配: /photo.JPG, /logo.png, /image.GIF
        
        # location的作用：定义URL匹配规则和处理方式；
        location /local/ {  ###   前缀匹配（默认），最长前缀匹配；匹配以/local/ 开头的所有路径，比如：/api/users, /api/orders, /api/v1/products
            
            proxy_pass http://127.0.0.1:8080/; ## 代理到的后端服务；用于设置反向代理的目标服务器地址；格式是 http://ip:port/; 或者是： https://域名:端口/;
            
            # 基本代理头设置
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 超时设置
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # location的作用：定义URL匹配规则和处理方式； 
        location /api/ {  ##代理远程服务 - upstream
            proxy_pass http://backend_remote/;  #代理到后端服务。用于设置反向代理的目标服务器地址; 代理到 上游服务器组； 
            # eg: http://上游组名称/; 其中 上游组 是通过 upstream 指令定义一组服务器（如多台后端实例），实现负载均衡，proxy_pass 指向该组名称。
            

            # proxy_pass 带路径（含 / 或具体路径）;（带结尾 / 或额外路径）Nginx 会用 proxy_pass 中的路径替换 location 匹配的路径部分，再拼接剩余 URI。
            #  比如：
            #location /api/ {
            #     proxy_pass 带具体路径 /v2/
            #     proxy_pass http://localhost:8080/v2/;
            #}
            # 当请求 http://example.com/api/user 时，实际转发到：http://localhost:8080/v2/user（/api/ 被替换为 /v2/）

            # 完整的代理头配置
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # WebSocket支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 缓冲区设置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # 健康检查和故障转移
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }
        
        #  location的作用：定义URL匹配规则和处理方式； 
        location /static/ { # 静态文件代理（本地服务）
            proxy_pass http://127.0.0.1:9000/; ## #代理到后端服务
            proxy_set_header Host $host;
            
            # 静态文件缓存
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 1m;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
        
        # 负载均衡API代理
        location /balance/ {
            proxy_pass http://api_cluster/;  #代理到后端服务， 路由到 上有服务器 api_cluster 组
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 连接池设置
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # 自定义错误页面
            proxy_intercept_errors on;
            error_page 502 503 504 /50x.html;
        }
        
        # 文件上传代理（大文件支持）
        location /upload/ {
            client_max_body_size 100M;
            proxy_pass http://127.0.0.1:8080/upload/;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 大文件上传优化
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        
        # 错误页面
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
    
    # HTTPS 配置
    server {
        listen 443 ssl http2;
        server_name example.com www.example.com;
        
        # SSL 证书配置
        ssl_certificate /path/to/cert.pem;
        ssl_certificate_key /path/to/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
        
        # HTTPS 代理到本地HTTP服务
        location / {
            proxy_pass http://127.0.0.1:8080;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;
        }
    }
    
    # 基于域名的代理
    server {
        listen 80;
        server_name api.example.com;
        
        location / {
            proxy_pass http://backend_remote;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
    
    # 基于路径的多服务代理
    server {
        listen 80;
        server_name services.example.com;
        
        # 用户服务（本地）
        location /user/ {
            proxy_pass http://127.0.0.1:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # 订单服务（远程）
        location /order/ {
            proxy_pass http://192.168.1.100:3002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # 支付服务（远程集群）
        location /payment/ {
            proxy_pass http://api_cluster/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

# Stream 块 - TCP/UDP 代理
stream {
    # TCP 代理配置
    upstream mysql_backend {
        server 127.0.0.1:3306;
        server 192.168.1.100:3306 backup;
    }
    
    server {
        listen 13306;
        proxy_pass mysql_backend;
        proxy_timeout 1s;
        proxy_responses 1;
        error_log /var/log/nginx/mysql_proxy.log;
    }
    
    # Redis 代理
    server {
        listen 16379;
        proxy_pass 192.168.1.200:6379;
        proxy_timeout 1s;
        proxy_responses 1;
    }
}