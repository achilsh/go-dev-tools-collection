    server {
        listen       443 ssl;
        server_name  data_debug.miti.chat;

        ssl_certificate /etc/letsencrypt/live/miti.chat-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/miti.chat-0001/privkey.pem;

        location /api {
            include /etc/nginx/cros.conf;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:31000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /functions {
            include /etc/nginx/cros.conf;
            #proxy_pass http://internal-llm-orch-test-internal-531020095.us-east-1.elb.amazonaws.com:8080;
            set $llm_elb "internal-llm-orch-staging-internal-540953045.us-east-1.elb.amazonaws.com:8080";
            proxy_pass http://$llm_elb;
            #proxy_pass http://internal-llm-orch-staging-internal-540953045.us-east-1.elb.amazonaws.com:8080;
            resolver 169.254.169.253 valid=10s ipv6=off;

            # 关键修复参数
            proxy_set_header Host $host;  # 确保 Host 头传递
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时控制
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # 重试逻辑
            proxy_next_upstream error timeout invalid_header;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # 禁用 SSL 验证（仅用于测试）
            proxy_ssl_verify off;
        }

        # 匹配固定的 /stream 路径
        location ~ ^/(stream|translate|transcribe|add_knowledge|delete_knowledgebase|create_knowledgebase|get_knowledgebase|check_documents_status)$ {
            include /etc/nginx/cros.conf;
            set $llm_elb "internal-llm-orch-staging-internal-540953045.us-east-1.elb.amazonaws.com:8080";
            proxy_pass http://$llm_elb;
            #proxy_pass http://internal-llm-orch-staging-internal-540953045.us-east-1.elb.amazonaws.com:8080;
            resolver 169.254.169.253 valid=10s ipv6=off;

            # 关键修复参数
            proxy_set_header Host $host;  # 确保 Host 头传递
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时控制
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # 重试逻辑
            proxy_next_upstream error timeout invalid_header;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # 禁用 SSL 验证（仅用于测试）
            proxy_ssl_verify off;
        }
    }
