user nginx;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
        # multi_accept on;
}

http {

        ##
        # Basic Settings
        ##
        sendfile on;
        tcp_nopush on;
        types_hash_max_size 4096;
        server_tokens off;

        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        include /etc/nginx/mime.types;
        #default_type application/octet-stream;

        ##
        # SSL Settings
        ##

        #ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
        #ssl_prefer_server_ciphers on;

        ##
        # Logging Settings
        ##

#       access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        log_format custom_format '$remote_addr - $remote_user [$time_local] "$request" '
                             'status=$status body_bytes_sent=$body_bytes_sent '
                             'referrer="$http_referer" user_agent="$http_user_agent" body="$request_body" server="$server_name" '
                             'request_time=$request_time '
                             'upstream_response_time=$upstream_response_time '
                             'referrer="$http_referer" user_agent="$http_user_agent" '
                             'args="$args"'; # 添加请求参数到日志中

        access_log /var/log/nginx/access.log custom_format;



        ##
        # Gzip Settings
        ##

        gzip on;
        gzip_min_length 1k;
        gzip_buffers 4 16k;
        gzip_comp_level 7;
        gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png application/wasm;
        gzip_vary off;
        gzip_disable "MSIE [1-6]\.";

        ##
        # Virtual Host Configs
        ##

        #include /etc/nginx/conf.d/*.conf;
        #include /etc/nginx/sites-enabled/*;

    # Allow special characters in headers
    ignore_invalid_headers off;
    # Allow any size file to be uploaded.
    # Set to a value such as 1000m; to restrict file size to a specific value
    client_max_body_size 0;
    # Disable buffering
    proxy_buffering off;
    proxy_request_buffering off;

    upstream im_msg_gateway{
        server 127.0.0.1:10001;        #IM Message server address Multiple can be specified according to the deployment
    }
    upstream im_api{
        server 127.0.0.1:10002;        #IM Group user api server address Multiple can be specified according to the deployment
    }
    upstream im_grafana{
        server 127.0.0.1:10007;        #IM Statistical server address The machine where docker-compose starts
    }
    upstream im_chat_api{
        server 127.0.0.1:10008;        #IM Business version login registration server address Multiple can be specified according to the deployment
    }
    upstream im_admin_api{
        server 127.0.0.1:10009;        #IM The admin address of the commercial version can specify multiple units according to the deployment situation
    }
    upstream im_open_rtc{
        server 127.0.0.1:7880;         #rtc Audio and video call server address Multiple devices can be specified according to the deployment
    }
    upstream minio_s3_2 {
        least_conn;
        server 127.0.0.1:10005;
    }
    upstream minio_console_2 {
        least_conn;
        server 127.0.0.1:9090;
    }
    # nacos
    upstream nacos_cluster {
        server 127.0.0.1:28848;
        server 127.0.0.1:28849;
                server 127.0.0.1:28850;
            }

            #
            server {
                listen       443 ssl;
                server_name  toy.miti.chat;

                # ssl_certificate "/root/terminal/fullchain1.pem";
                # ssl_certificate_key "/root/terminal/privkey1.pem";
                ssl_certificate /etc/letsencrypt/live/miti.chat-0001/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/miti.chat-0001/privkey.pem;

                # Load configuration files for the default server block.

                location /ws { # WebSocket连接的路径
                    proxy_pass http://localhost:31688/ws; # WebSocket服务器地址和端口
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;

                    # 设置长连接超时时间，根据需要修改
                    proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }


        location /push { # WebSocket连接的路径
            proxy_pass http://localhost:31688/push; # WebSocket服务器地址和端口
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    server {
        listen       443 ssl;
