            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v2 {
            include /etc/nginx/cros.conf;
            rewrite ^/api/(.*)$ /api/$1 break;
            proxy_pass http://127.0.0.1:60110;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        location /ucenter {
            include /etc/nginx/cros.conf;
            rewrite ^/ucenter/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:4433;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v2/GetQuotes {
             # 允许 SSE 连接
            add_header Cache-Control no-cache;
            add_header Content-Type text/event-stream;
            add_header Access-Control-Allow-Origin *;  # 允许跨域请求

            # 如果需要，添加其他头信息
            # add_header X-Content-Type-Options nosniff;

            # 将请求代理到后端应用（例如 Node.js）
            proxy_pass http://127.0.0.1:60115;  # 替换为您的后端服务地址
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }

